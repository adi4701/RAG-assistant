services:
  - type: web
    name: lexrag-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CHROMA_MODE
        value: embedded
      - key: CHROMA_PERSIST_PATH
        value: /opt/render/project/src/data/chroma
      - key: ONNXRUNTIME_PROVIDERS
        value: CPUExecutionProvider
      - key: ANONYMIZED_TELEMETRY
        value: "false"
      - key: CHROMA_ANONYMIZED_TELEMETRY
        value: "false"
    disk:
      name: chroma-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
